<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebulosa Sonora · Sintetizador Sinestésico 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Inter', sans-serif; color: #fff; user-select: none; }

        /* Three.js canvas container */
        #three-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }

        /* Top HUD */
        #hud {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 10;
            padding: 16px 24px;
            background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
            display: flex; align-items: center; justify-content: space-between;
            pointer-events: none;
        }
        #hud > * { pointer-events: auto; }
        .hud-title {
            font-size: 11px; font-weight: 300; letter-spacing: 4px; text-transform: uppercase;
            color: rgba(255,255,255,0.4); text-shadow: 0 0 30px rgba(100,150,255,0.2);
        }
        .hud-title strong { color: rgba(255,255,255,0.7); font-weight: 600; letter-spacing: 0; }
        .hud-controls { display: flex; gap: 10px; align-items: center; }
        .hud-btn {
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.5); padding: 6px 14px; border-radius: 20px;
            font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
            cursor: pointer; transition: all 0.3s ease; font-family: 'Inter', sans-serif;
        }
        .hud-btn:hover { background: rgba(255,255,255,0.12); color: #fff; border-color: rgba(255,255,255,0.3); }
        .hud-btn.active { background: rgba(255,255,255,0.15); color: #fff; border-color: rgba(100,180,255,0.5); box-shadow: 0 0 20px rgba(100,180,255,0.1); }

        /* Preset selector */
        #preset-selector {
            position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
            z-index: 10; display: flex; gap: 4px;
            background: rgba(0,0,0,0.5); padding: 6px; border-radius: 12px;
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.06);
        }
        .preset-btn {
            background: transparent; border: none; color: rgba(255,255,255,0.3);
            padding: 6px 16px; border-radius: 8px; font-size: 11px; font-weight: 600;
            letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
            transition: all 0.3s ease; font-family: 'Inter', sans-serif;
        }
        .preset-btn:hover { color: rgba(255,255,255,0.6); background: rgba(255,255,255,0.05); }
        .preset-btn.active { color: #fff; background: rgba(255,255,255,0.1); box-shadow: 0 0 20px rgba(100,150,255,0.1); }

        /* Bottom keyboard panel */
        #keyboard-panel {
            position: fixed; bottom: 0; left: 0; width: 100%; z-index: 10;
            background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 70%, transparent 100%);
            padding: 30px 20px 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        #keyboard-label {
            font-size: 9px; letter-spacing: 3px; text-transform: uppercase;
            color: rgba(255,255,255,0.15); margin-bottom: 12px;
            font-weight: 300;
        }
        #keyboard {
            display: flex; position: relative; height: 130px;
            justify-content: center;
        }
        .octave-group { display: flex; position: relative; }
        .octave-sep {
            width: 2px; background: rgba(255,255,255,0.05); margin: 0 4px;
            align-self: stretch;
        }
        .wk {
            width: 36px; height: 130px;
            background: linear-gradient(180deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.06) 100%);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 0 0 5px 5px;
            cursor: pointer; transition: all 0.05s ease;
            display: flex; flex-direction: column; align-items: center;
            justify-content: flex-end; padding-bottom: 10px;
            position: relative;
            margin: 0 1px;
        }
        .wk .key-label {
            font-size: 9px; color: rgba(255,255,255,0.2); font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
            pointer-events: none;
        }
        .wk .note-label {
            font-size: 8px; color: rgba(255,255,255,0.08); margin-bottom: 4px;
            pointer-events: none;
        }
        .wk.pressed {
            background: linear-gradient(180deg, rgba(255,255,255,0.3) 0%, rgba(100,180,255,0.2) 100%) !important;
            border-color: rgba(100,180,255,0.4) !important;
            transform: scaleY(0.97);
        }
        .bk {
            width: 22px; height: 80px;
            background: linear-gradient(180deg, rgba(20,20,30,0.95) 0%, rgba(10,10,15,0.95) 100%);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 0 0 4px 4px;
            cursor: pointer; transition: all 0.05s ease;
            position: absolute;
            top: 0;
            z-index: 2;
            display: flex; flex-direction: column; align-items: center;
            justify-content: flex-end; padding-bottom: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .bk .key-label {
            font-size: 7px; color: rgba(255,255,255,0.25); font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
            pointer-events: none;
        }
        .bk.pressed {
            background: linear-gradient(180deg, rgba(60,60,80,0.95) 0%, rgba(40,40,60,0.95) 100%) !important;
            border-color: rgba(100,180,255,0.5) !important;
            transform: scaleY(0.95);
        }

        /*** NOTE GLOW on each key ***/
        .wk .key-glow, .bk .key-glow {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border-radius: inherit;
            opacity: 0;
            transition: opacity 0.1s ease;
            pointer-events: none;
        }
        .wk.pressed .key-glow, .bk.pressed .key-glow { opacity: 1; }

        /* Bottom info bar */
        #info-bar {
            position: fixed; bottom: 175px; left: 50%; transform: translateX(-50%);
            z-index: 5;
            display: flex; gap: 20px; align-items: center;
            font-size: 10px; letter-spacing: 1px; color: rgba(255,255,255,0.15);
            font-weight: 300;
        }
        #info-bar span { display: flex; align-items: center; gap: 6px; }
        #bpm-display { color: rgba(255,255,255,0.3); }
        .dot {
            display: inline-block; width: 4px; height: 4px; border-radius: 50%;
            background: rgba(255,255,255,0.1); transition: all 0.15s ease;
        }
        .dot.active { background: rgba(100,180,255,0.6); box-shadow: 0 0 8px rgba(100,180,255,0.3); }

        /* Volume slider */
        .vol-container { display: flex; align-items: center; gap: 8px; }
        .vol-container label { font-size: 9px; color: rgba(255,255,255,0.2); letter-spacing: 1px; }
        #volume-slider {
            -webkit-appearance: none; appearance: none;
            width: 60px; height: 3px; border-radius: 2px;
            background: rgba(255,255,255,0.1);
            outline: none; cursor: pointer;
        }
        #volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 10px; height: 10px; border-radius: 50%;
            background: rgba(255,255,255,0.3); cursor: pointer;
            transition: all 0.2s;
        }
        #volume-slider::-webkit-slider-thumb:hover { background: rgba(255,255,255,0.5); transform: scale(1.2); }

        /* Back button */
        #back-link {
            position: fixed; top: 16px; right: 24px; z-index: 20;
            color: rgba(255,255,255,0.3); text-decoration: none;
            font-size: 11px; letter-spacing: 1px; font-weight: 300;
            transition: all 0.3s;
            padding: 6px 14px; border: 1px solid rgba(255,255,255,0.06);
            border-radius: 20px;
        }
        #back-link:hover { color: rgba(255,255,255,0.6); border-color: rgba(255,255,255,0.15); }

        /* Loading */
        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 999; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: #000;
            transition: opacity 1s ease;
        }
        #loading.hidden { opacity: 0; pointer-events: none; }
        #loading .spinner {
            width: 30px; height: 30px; border: 2px solid rgba(255,255,255,0.06);
            border-top-color: rgba(255,255,255,0.3);
            border-radius: 50%; animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading p { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: rgba(255,255,255,0.15); font-weight: 300; }

        @media (max-width: 768px) {
            .wk { width: 28px; height: 100px; }
            .bk { width: 17px; height: 60px; }
            #keyboard { height: 100px; }
            #keyboard-panel { padding: 20px 10px 12px; }
            #info-bar { bottom: 140px; font-size: 8px; gap: 12px; }
            .hud-title { font-size: 9px; }
            #preset-selector { top: 55px; }
            .preset-btn { padding: 4px 10px; font-size: 9px; }
            #back-link { font-size: 9px; padding: 4px 10px; }
            #volume-slider { width: 40px; }
            .hud-btn { padding: 4px 10px; font-size: 9px; }
        }
    </style>
</head>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
    }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ─── NOTES & FREQUENCIES ────────────────────────────────────────
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
function freqFromNote(note) {
    const n = NOTE_NAMES.indexOf(note.replace(/[0-9]/g,''));
    const oct = parseInt(note.replace(/[A-Z#]+/g,''));
    if (n === -1) return 440;
    const semi = (oct - 4) * 12 + n;
    return 440 * Math.pow(2, semi / 12);
}

// Notes layout: 2 octaves C3 to B4 (24 keys)
const whiteKeys = ['C','D','E','F','G','A','B'];
const blackKeys = ['C#','D#','F#','G#','A#'];
function octaveNotes(oct) {
    return whiteKeys.map(w => w+oct).concat(blackKeys.map(b => b+oct));
}

const ALL_NOTES = [];
for (let oct = 3; oct <= 4; oct++) {
    whiteKeys.forEach(w => ALL_NOTES.push(w+oct));
}

const NOTE_COLORS = {
    'C': new THREE.Color(0.95, 0.15, 0.15),   // Red
    'D': new THREE.Color(0.95, 0.60, 0.10),   // Orange
    'E': new THREE.Color(0.90, 0.85, 0.10),   // Yellow
    'F': new THREE.Color(0.20, 0.80, 0.30),   // Green
    'G': new THREE.Color(0.10, 0.70, 0.85),   // Cyan
    'A': new THREE.Color(0.40, 0.30, 0.95),   // Blue
    'B': new THREE.Color(0.85, 0.20, 0.80),   // Purple
};

const KEYBOARD_MAP = {
    // Octave 3 (C3-B3) - left hand
    'z': 'C3', 's': 'C#3', 'x': 'D3', 'd': 'D#3', 'c': 'E3',
    'v': 'F3', 'g': 'F#3', 'b': 'G3', 'h': 'G#3', 'n': 'A3', 'j': 'A#3', 'm': 'B3',
    // Octave 4 (C4-B4) - right hand
    'q': 'C4', '2': 'C#4', 'w': 'D4', '3': 'D#4', 'e': 'E4',
    'r': 'F4', '5': 'F#4', 't': 'G4', '6': 'G#4', 'y': 'A4', '7': 'A#4', 'u': 'B4',
    'i': 'C5',
};

// ─── WEB AUDIO ENGINE ───────────────────────────────────────────
class SynthEngine {
    constructor() {
        this.ctx = null;
        this.masterGain = null;
        this.analyser = null;
        this.activeNodes = new Map(); // note -> {nodes, gain, filter, lfo}
        this.preset = 'nebula';
        this.volume = 0.7;
        this.freqData = null;
        this.timeData = null;
        this.initialized = false;
    }

    init() {
        if (this.initialized) return;
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.masterGain = this.ctx.createGain();
        this.masterGain.gain.value = this.volume;
        this.analyser = this.ctx.createAnalyser();
        this.analyser.fftSize = 256;
        this.freqData = new Uint8Array(this.analyser.frequencyBinCount);
        this.timeData = new Uint8Array(this.analyser.frequencyBinCount);
        this.masterGain.connect(this.analyser);
        this.analyser.connect(this.ctx.destination);
        this.initialized = true;
    }

    resume() {
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    }

    setVolume(v) {
        this.volume = v;
        if (this.masterGain) this.masterGain.gain.setTargetAtTime(v, this.ctx.currentTime, 0.05);
    }

    setPreset(p) { this.preset = p; }

    getPresetConfig() {
        const cfg = {
            nebula: { oscTypes: ['sawtooth','sine'], detune: 7, filter: 1200, filterEnv: 0.6, attack: 0.01, release: 0.3, sub: 0.3, chorus: true },
            crystal: { oscTypes: ['sine','sine'], detune: 12, filter: 3000, filterEnv: 0.3, attack: 0.005, release: 0.6, sub: 0, chorus: true },
            bass: { oscTypes: ['sawtooth','square'], detune: 3, filter: 400, filterEnv: 0.8, attack: 0.02, release: 0.25, sub: 0.5, chorus: false },
            pad: { oscTypes: ['sine','triangle'], detune: 8, filter: 2000, filterEnv: 0.4, attack: 0.2, release: 1.0, sub: 0.2, chorus: true },
            lead: { oscTypes: ['square','sawtooth'], detune: 5, filter: 2500, filterEnv: 0.5, attack: 0.005, release: 0.2, sub: 0, chorus: false },
        };
        return cfg[this.preset] || cfg.nebula;
    }

    noteOn(note, velocity = 0.7) {
        if (!this.ctx || !this.masterGain) return;
        if (this.activeNodes.has(note)) this.noteOff(note);
        const freq = freqFromNote(note);
        const cfg = this.getPresetConfig();
        const now = this.ctx.currentTime;

        const noteGroup = { nodes: [], gain: null, filter: null, stopTimer: null };

        // Sub oscillator
        if (cfg.sub > 0) {
            const sub = this.ctx.createOscillator();
            sub.type = 'sine';
            sub.frequency.value = freq * 0.5;
            const subG = this.ctx.createGain();
            subG.gain.value = cfg.sub * velocity * 0.2;
            sub.connect(subG);
            subG.connect(this.masterGain);
            sub.start(now);
            noteGroup.nodes.push(sub, subG);
        }

        // Main oscillators
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = cfg.filter;
        filter.Q.value = 2;
        noteGroup.filter = filter;

        const mixGain = this.ctx.createGain();
        mixGain.gain.value = 0;
        noteGroup.gain = mixGain;

        cfg.oscTypes.forEach((type, i) => {
            const osc = this.ctx.createOscillator();
            osc.type = type;
            osc.frequency.value = freq + (i === 1 ? cfg.detune : 0);
            const oscG = this.ctx.createGain();
            oscG.gain.value = velocity * (0.4 / cfg.oscTypes.length);
            osc.connect(oscG);
            oscG.connect(filter);
            noteGroup.nodes.push(osc, oscG);
            osc.start(now);
        });

        // LFO for chorus
        if (cfg.chorus) {
            const lfo = this.ctx.createOscillator();
            lfo.type = 'sine';
            lfo.frequency.value = 3.5;
            const lfoG = this.ctx.createGain();
            lfoG.gain.value = 2;
            lfo.connect(lfoG);
            lfoG.connect(filter.frequency);
            lfo.start(now);
            noteGroup.nodes.push(lfo, lfoG);
        }

        // Noise burst for attack
        if (this.preset === 'crystal' || this.preset === 'lead') {
            const bufSize = this.ctx.sampleRate * 0.04;
            const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i/bufSize, 2);
            const noise = this.ctx.createBufferSource();
            noise.buffer = buf;
            const noiseG = this.ctx.createGain();
            noiseG.gain.value = velocity * 0.15;
            noise.connect(noiseG);
            noiseG.connect(this.masterGain);
            noise.start(now);
            noteGroup.nodes.push(noise, noiseG);
        }

        filter.connect(mixGain);
        mixGain.connect(this.masterGain);

        // Envelope
        mixGain.gain.setValueAtTime(0, now);
        mixGain.gain.linearRampToValueAtTime(velocity * 0.6, now + cfg.attack);
        // Filter envelope
        filter.frequency.setValueAtTime(100, now);
        filter.frequency.exponentialRampToValueAtTime(cfg.filter, now + cfg.attack + 0.05);

        this.activeNodes.set(note, noteGroup);
    }

    noteOff(note) {
        const g = this.activeNodes.get(note);
        if (!g) return;
        const cfg = this.getPresetConfig();
        const now = this.ctx.currentTime;
        const release = g.gain && g.gain.gain ? (cfg.release || 0.3) : 0.01;

        if (g.gain && g.gain.gain) {
            g.gain.gain.cancelScheduledValues(now);
            g.gain.gain.setValueAtTime(g.gain.gain.value, now);
            g.gain.gain.exponentialRampToValueAtTime(0.001, now + release);
        }
        if (g.filter) {
            g.filter.frequency.cancelScheduledValues(now);
            g.filter.frequency.exponentialRampToValueAtTime(20, now + release);
        }

        g.stopTimer = setTimeout(() => {
            g.nodes.forEach(n => {
                try { n.stop(); } catch(e) {}
                try { n.disconnect(); } catch(e) {}
            });
            this.activeNodes.delete(note);
        }, (release + 0.05) * 1000);
    }

    allNotesOff() {
        this.activeNodes.forEach((g, note) => this.noteOff(note));
    }

    getAnalyserData() {
        if (!this.analyser) return { freq: new Uint8Array(128), time: new Uint8Array(128) };
        this.analyser.getByteFrequencyData(this.freqData);
        this.analyser.getByteTimeDomainData(this.timeData);
        return { freq: this.freqData, time: this.timeData };
    }
}

// ─── THREE.JS SCENE ─────────────────────────────────────────────
class VisualScene {
    constructor(container) {
        this.container = container;
        this.activeNotes = new Set();
        this.bursts = [];
        this.noteOrbs = {};
        this.audioHistory = [];
        this.beatPhase = 0;
        this.beatTime = 0;

        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x050510);

        const w = window.innerWidth;
        const h = window.innerHeight;
        this.camera = new THREE.PerspectiveCamera(60, w/h, 0.1, 100);
        this.camera.position.set(0, 2, 10);
        this.camera.lookAt(0, 0, 0);

        this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        this.renderer.setSize(w, h);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
        this.renderer.toneMappingExposure = 1.2;
        container.appendChild(this.renderer.domElement);

        // Post-processing
        this.composer = new EffectComposer(this.renderer);
        const renderPass = new RenderPass(this.scene, this.camera);
        this.composer.addPass(renderPass);

        this.bloom = new UnrealBloomPass(new THREE.Vector2(w, h), 0.6, 0.3, 0.15);
        this.composer.addPass(this.bloom);

        // Controls (subtle auto-orbit with limited manual override)
        this.controls = new OrbitControls(this.camera, this.renderer.domElement);
        this.controls.enableDamping = true;
        this.controls.dampingFactor = 0.05;
        this.controls.autoRotate = true;
        this.controls.autoRotateSpeed = 0.8;
        this.controls.target.set(0, 0, 0);
        this.controls.maxPolarAngle = Math.PI / 2.2;
        this.controls.minDistance = 4;
        this.controls.maxDistance = 20;

        this.buildScene();
        window.addEventListener('resize', () => this.onResize());
    }

    buildScene() {
        const S = this.scene;

        // Ambient - dim blue
        const amb = new THREE.AmbientLight(0x111122, 0.4);
        S.add(amb);

        // Main directional
        const dir = new THREE.DirectionalLight(0x8899cc, 1);
        dir.position.set(5, 10, 5);
        S.add(dir);

        // 3 Colored point lights orbiting
        this.orbitLights = [];
        const lightColors = [0xff3366, 0x33ff66, 0x3366ff];
        for (let i = 0; i < 3; i++) {
            const pl = new THREE.PointLight(lightColors[i], 1.5, 15);
            pl.position.set(Math.cos(i * 2.094) * 5, 1 + Math.sin(i * 1.3) * 1, Math.sin(i * 2.094) * 5);
            S.add(pl);
            this.orbitLights.push({ light: pl, angle: i * 2.094, speed: 0.3 + i * 0.1, color: new THREE.Color(lightColors[i]) });
        }

        // Star field
        const starCount = 4000;
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(starCount * 3);
        const starSizes = new Float32Array(starCount);
        const starColors = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = 25 + Math.random() * 35;
            starPos[i*3] = r * Math.sin(phi) * Math.cos(theta);
            starPos[i*3+1] = r * Math.cos(phi) * (0.3 + Math.random() * 0.7);
            starPos[i*3+2] = r * Math.sin(phi) * Math.sin(theta);
            starSizes[i] = 0.3 + Math.random() * 0.8;
            const tc = 0.4 + Math.random() * 0.6;
            starColors[i*3] = tc * (0.6 + Math.random() * 0.4);
            starColors[i*3+1] = tc * (0.6 + Math.random() * 0.4);
            starColors[i*3+2] = tc;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        starGeo.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));
        starGeo.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
        const starMat = new THREE.PointsMaterial({
            size: 0.12, vertexColors: true, transparent: true, opacity: 0.8,
            blending: THREE.AdditiveBlending, depthWrite: false,
            sizeAttenuation: true,
        });
        this.stars = new THREE.Points(starGeo, starMat);
        S.add(this.stars);

        // Nebula particles (around center)
        const nebCount = 2000;
        const nebGeo = new THREE.BufferGeometry();
        const nebPos = new Float32Array(nebCount * 3);
        const nebCol = new Float32Array(nebCount * 3);
        this.nebulaColors = [];
        for (let i = 0; i < nebCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = 0.5 + Math.random() * 4;
            nebPos[i*3] = r * Math.sin(phi) * Math.cos(theta);
            nebPos[i*3+1] = r * Math.cos(phi) * (0.5 + Math.random() * 0.5);
            nebPos[i*3+2] = r * Math.sin(phi) * Math.sin(theta);
            const hue = Math.random();
            const c = new THREE.Color().setHSL(hue, 0.8, 0.4 + Math.random() * 0.3);
            nebCol[i*3] = c.r; nebCol[i*3+1] = c.g; nebCol[i*3+2] = c.b;
            this.nebulaColors.push(c);
        }
        nebGeo.setAttribute('position', new THREE.BufferAttribute(nebPos, 3));
        nebGeo.setAttribute('color', new THREE.BufferAttribute(nebCol, 3));
        const nebMat = new THREE.PointsMaterial({
            size: 0.08, vertexColors: true, transparent: true, opacity: 0.6,
            blending: THREE.AdditiveBlending, depthWrite: false,
            sizeAttenuation: true,
        });
        this.nebulaParticles = new THREE.Points(nebGeo, nebMat);
        S.add(this.nebulaParticles);
        this.nebulaPos = nebPos;

        // Central Torus Knot
        const tkGeo = new THREE.TorusKnotGeometry(0.9, 0.35, 180, 24);
        const tkMat = new THREE.MeshPhysicalMaterial({
            color: 0x4466aa, emissive: 0x223377, emissiveIntensity: 0.5,
            metalness: 0.3, roughness: 0.2, clearcoat: 0.4,
            transparent: true, opacity: 0.9,
            envMapIntensity: 0.6,
        });
        this.torusKnot = new THREE.Mesh(tkGeo, tkMat);
        this.torusKnot.position.y = 0.5;
        S.add(this.torusKnot);

        // Inner glowing sphere
        const glowGeo = new THREE.SphereGeometry(0.3, 32, 32);
        const glowMat = new THREE.MeshBasicMaterial({
            color: 0x4488ff, transparent: true, opacity: 0.3,
        });
        this.glowSphere = new THREE.Mesh(glowGeo, glowMat);
        this.glowSphere.position.y = 0.5;
        S.add(this.glowSphere);

        // Orbital rings
        this.orbitRings = [];
        for (let i = 0; i < 3; i++) {
            const ringGeo = new THREE.RingGeometry(1.8 + i * 0.8, 1.82 + i * 0.8, 64);
            const ringMat = new THREE.MeshBasicMaterial({
                color: new THREE.Color().setHSL(i * 0.33, 0.6, 0.3),
                transparent: true, opacity: 0.08 + i * 0.04,
                side: THREE.DoubleSide, depthWrite: false,
            });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 2 + (i * 0.3);
            ring.rotation.z = i * 0.5;
            ring.position.y = 0.5;
            S.add(ring);
            this.orbitRings.push(ring);
        }

        // Wave floor
        const floorGeo = new THREE.PlaneGeometry(20, 20, 64, 64);
        const floorMat = new THREE.MeshPhysicalMaterial({
            color: 0x111133, emissive: 0x0a0a22, emissiveIntensity: 0.3,
            metalness: 0.8, roughness: 0.3, transparent: true, opacity: 0.5,
            side: THREE.DoubleSide, wireframe: false,
        });
        this.floor = new THREE.Mesh(floorGeo, floorMat);
        this.floor.rotation.x = -Math.PI / 2;
        this.floor.position.y = -0.8;
        S.add(this.floor);
        this.floorPos = floorGeo.attributes.position;

        // Secondary floor grid
        const gridHelper = new THREE.GridHelper(16, 32, 0x3366aa, 0x224488);
        gridHelper.position.y = -0.79;
        gridHelper.material.transparent = true;
        gridHelper.material.opacity = 0.15;
        S.add(gridHelper);

        // Note burst system (re-use buffer)
        this.burstGeo = new THREE.BufferGeometry();
        this.burstCount = 0;
        this.burstPos = new Float32Array(2000 * 3);
        this.burstCol = new Float32Array(2000 * 3);
        this.burstSiz = new Float32Array(2000);
        this.burstGeo.setAttribute('position', new THREE.BufferAttribute(this.burstPos, 3));
        this.burstGeo.setAttribute('color', new THREE.BufferAttribute(this.burstCol, 3));
        this.burstGeo.setAttribute('size', new THREE.BufferAttribute(this.burstSiz, 1));
        const burstMat = new THREE.PointsMaterial({
            size: 0.15, vertexColors: true, transparent: true, opacity: 0.9,
            blending: THREE.AdditiveBlending, depthWrite: false,
            sizeAttenuation: true,
        });
        this.burstPoints = new THREE.Points(this.burstGeo, burstMat);
        S.add(this.burstPoints);
    }

    triggerNoteBurst(note, velocity = 0.7) {
        const baseName = note.replace(/[0-9]+/g, '');
        const color = NOTE_COLORS[baseName] || new THREE.Color(0.5, 0.5, 0.5);
        const noteIdx = ALL_NOTES.indexOf(note);
        const xPos = (noteIdx / ALL_NOTES.length - 0.5) * 6;

        const burstSize = Math.floor(15 + velocity * 25);
        const start = this.burstCount;
        for (let i = 0; i < burstSize && this.burstCount < 2000; i++) {
            const idx = this.burstCount;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = 0.2 + Math.random() * 1.5;
            this.burstPos[idx*3] = xPos + r * Math.sin(phi) * Math.cos(theta);
            this.burstPos[idx*3+1] = 1.2 + Math.abs(r * Math.cos(phi));
            this.burstPos[idx*3+2] = r * Math.sin(phi) * Math.sin(theta) * 0.5;
            this.burstCol[idx*3] = color.r; this.burstCol[idx*3+1] = color.g; this.burstCol[idx*3+2] = color.b;
            this.burstSiz[idx] = 0.1 + Math.random() * 0.25;
            this.burstCount++;
        }
        this.burstPoints.geometry.attributes.position.needsUpdate = true;
        this.burstPoints.geometry.attributes.color.needsUpdate = true;
        this.burstPoints.geometry.attributes.size.needsUpdate = true;
        this.burstPoints.geometry.setDrawRange(0, this.burstCount);
    }

    updateBursts() {
        // Slowly age bursts by fading them (move them upward and shrink)
        const newCount = Math.max(0, this.burstCount - 8);
        if (newCount < this.burstCount) {
            for (let i = newCount; i < this.burstCount; i++) {
                this.burstPos[i*3] = 0;
                this.burstPos[i*3+1] = -5;
                this.burstPos[i*3+2] = 0;
                this.burstSiz[i] = 0;
            }
            this.burstCount = newCount;
            this.burstPoints.geometry.attributes.position.needsUpdate = true;
            this.burstPoints.geometry.attributes.size.needsUpdate = true;
            this.burstPoints.geometry.setDrawRange(0, this.burstCount);
        }
        // Move remaining bursts upward
        for (let i = 0; i < this.burstCount; i++) {
            this.burstPos[i*3+1] += 0.01;
            this.burstSiz[i] *= 0.995;
        }
    }

    setNoteActive(note, active) {
        if (active) this.activeNotes.add(note);
        else this.activeNotes.delete(note);
    }

    update(audioData, dt) {
        const freq = audioData.freq;
        const time = audioData.time;

        // Average energy
        let avgEnergy = 0;
        for (let i = 0; i < freq.length; i++) avgEnergy += freq[i] / 255;
        avgEnergy /= freq.length;

        // Low freq energy
        let lowEnergy = 0;
        for (let i = 0; i < 8; i++) lowEnergy += freq[i] / 255;
        lowEnergy /= 8;

        // High freq energy
        let highEnergy = 0;
        for (let i = 30; i < 60; i++) highEnergy += freq[i] / 255;
        highEnergy /= 30;

        this.audioHistory.push(avgEnergy);
        if (this.audioHistory.length > 30) this.audioHistory.shift();

        // Beat detection
        this.beatTime += dt;
        const recentAvg = this.audioHistory.slice(-10).reduce((a,b) => a+b, 0) / 10;
        const beatThreshold = recentAvg * 1.3;
        const isBeat = avgEnergy > beatThreshold && avgEnergy > 0.15;

        // ─── Stars ───
        this.stars.rotation.y += dt * 0.02 * (0.5 + avgEnergy);
        this.stars.material.size = 0.12 + avgEnergy * 0.15;

        // ─── Nebula particles ───
        const nbPos = this.nebulaParticles.geometry.attributes.position.array;
        for (let i = 0; i < nbPos.length / 3; i++) {
            nbPos[i*3] += Math.sin(i * 0.1 + Date.now() * 0.0003) * 0.0003 * (1 + avgEnergy);
            nbPos[i*3+1] += Math.cos(i * 0.13 + Date.now() * 0.0004) * 0.0003 * (1 + avgEnergy * 0.5);
            nbPos[i*3+2] += Math.sin(i * 0.17 + Date.now() * 0.00035) * 0.0003 * (1 + avgEnergy);
        }
        this.nebulaParticles.geometry.attributes.position.needsUpdate = true;
        this.nebulaParticles.material.size = 0.08 + lowEnergy * 0.12;
        this.nebulaParticles.material.opacity = 0.4 + avgEnergy * 0.3;

        // ─── Torus Knot ───
        this.torusKnot.rotation.x += dt * 0.3 * (0.5 + highEnergy * 0.5);
        this.torusKnot.rotation.y += dt * 0.5 * (0.5 + avgEnergy);
        this.torusKnot.rotation.z += dt * 0.1 * (0.5 + lowEnergy);

        // Color based on active notes
        let r = 0, g = 0, b = 0, count = 0;
        this.activeNotes.forEach(note => {
            const baseName = note.replace(/[0-9]+/g, '');
            const c = NOTE_COLORS[baseName];
            if (c) { r += c.r; g += c.g; b += c.b; count++; }
        });
        if (count > 0) {
            r /= count; g /= count; b /= count;
            this.torusKnot.material.color.setRGB(r, g, b);
            this.torusKnot.material.emissive.setRGB(r * 0.4, g * 0.4, b * 0.4);
        } else {
            // Drift with audio
            const hue = (Date.now() * 0.00005) % 1;
            this.torusKnot.material.color.setHSL(hue, 0.6, 0.3 + avgEnergy * 0.2);
            this.torusKnot.material.emissive.setHSL(hue, 0.8, 0.2 + avgEnergy * 0.2);
        }

        // Scale pulse on beat
        const targetScale = 1 + (isBeat ? 0.08 : 0) + lowEnergy * 0.1;
        const currentScale = this.torusKnot.scale.x;
        const newScale = currentScale + (targetScale - currentScale) * 0.1;
        this.torusKnot.scale.set(newScale, newScale, newScale);

        // Glow sphere
        this.glowSphere.material.color.set(this.torusKnot.material.color);
        this.glowSphere.material.opacity = 0.15 + avgEnergy * 0.3;
        this.glowSphere.scale.setScalar(1 + lowEnergy * 0.3);

        // ─── Orbital rings ───
        this.orbitRings.forEach((ring, i) => {
            ring.rotation.z += dt * (0.1 + i * 0.05) * (0.5 + avgEnergy);
            ring.material.opacity = 0.08 + i * 0.04 + avgEnergy * 0.1;
            const s = 1 + lowEnergy * 0.1 * (i + 1);
            ring.scale.set(s, s, s);
        });

        // ─── Orbiting lights ───
        this.orbitLights.forEach((ol, i) => {
            ol.angle += dt * ol.speed * (0.5 + avgEnergy * 0.5);
            const x = Math.cos(ol.angle) * 5;
            const z = Math.sin(ol.angle) * 5;
            ol.light.position.set(x, 0.5 + Math.sin(ol.angle * 1.3) * 1.5, z);
            ol.light.intensity = 1 + lowEnergy * 1.5 + (isBeat ? 1 : 0);
            if (count > 0) {
                ol.light.color.setRGB(
                    ol.color.r * (0.5 + r * 0.5),
                    ol.color.g * (0.5 + g * 0.5),
                    ol.color.b * (0.5 + b * 0.5)
                );
            }
        });

        // ─── Wave floor ───
        const fPos = this.floor.geometry.attributes.position.array;
        for (let i = 0; i < fPos.length / 3; i++) {
            const x = fPos[i*3];
            const z = fPos[i*3+2];
            const wave1 = Math.sin(x * 0.8 + Date.now() * 0.0008) * 0.05 * (0.3 + lowEnergy);
            const wave2 = Math.sin(z * 0.6 + Date.now() * 0.001) * 0.05 * (0.3 + avgEnergy);
            const wave3 = Math.sin((x + z) * 0.5 + Date.now() * 0.0006) * 0.03 * (0.3 + highEnergy);
            fPos[i*3+1] = wave1 + wave2 + wave3;
        }
        this.floor.geometry.attributes.position.needsUpdate = true;
        this.floor.material.emissiveIntensity = 0.2 + lowEnergy * 0.4;
        this.floor.material.opacity = 0.3 + avgEnergy * 0.3;

        // ─── Burst particles ───
        this.updateBursts();

        // ─── Camera bob ───
        if (isBeat) {
            this.camera.position.y += 0.02;
        }

        // ─── Bloom ───
        this.bloom.strength = 0.3 + avgEnergy * 0.5;

        // ─── Controls ───
        this.controls.update();

        // ─── Render ───
        this.composer.render();
    }

    onResize() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        this.camera.aspect = w/h;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(w, h);
        this.composer.setSize(w, h);
    }

    dispose() {
        this.renderer.dispose();
        this.container.removeChild(this.renderer.domElement);
    }
}

// ─── KEYBOARD UI ────────────────────────────────────────────────
function buildKeyboard(container, synth, visual) {
    const NOTE_LABELS = { 'C':'Do','D':'Re','E':'Mi','F':'Fa','G':'Sol','A':'La','B':'Si' };
    const KEY_MAP = {
        'C3':'Z','C#3':'S','D3':'X','D#3':'D','E3':'C',
        'F3':'V','F#3':'G','G3':'B','G#3':'H','A3':'N','A#3':'J','B3':'M',
        'C4':'Q','C#4':'2','D4':'W','D#4':'3','E4':'E',
        'F4':'R','F#4':'5','G4':'T','G#4':'6','A4':'Y','A#4':'7','B4':'U',
        'C5':'I'
    };

    const whiteRegex = /^[A-G][0-9]$/;

    const allWhite = ALL_NOTES.filter(n => whiteRegex.test(n));

    const kb = document.getElementById('keyboard');

    function createKey(note, isBlack, blackLeft) {
        const el = document.createElement('div');
        el.className = isBlack ? 'bk' : 'wk';
        el.dataset.note = note;

        const glow = document.createElement('div');
        glow.className = 'key-glow';
        el.appendChild(glow);

        if (!isBlack) {
            const nl = document.createElement('div');
            nl.className = 'note-label';
            const base = note.replace(/[0-9]+/g, '');
            nl.textContent = NOTE_LABELS[base] || base;
            el.appendChild(nl);
        }

        const kl = document.createElement('div');
        kl.className = 'key-label';
        kl.textContent = KEY_MAP[note] || '';
        el.appendChild(kl);

        if (isBlack && blackLeft !== undefined) {
            const whiteIdx = allWhite.indexOf(note.replace(/#/,'') + note.slice(-1));
            const prevWhiteIdx = allWhite.indexOf(note.replace(/#/,'').replace(/[A-G]/, m => {
                const notes = ['C','D','E','F','G','A','B'];
                const idx = notes.indexOf(m);
                return idx > 0 ? notes[idx-1] : m;
            }) + note.slice(-1));

            // Position: between the white key before and the white key of this note
            const posInOctave = NOTE_NAMES.indexOf(note.replace(/[0-9]/g,''));
            // Black keys positions: C# between C-D (pos 1), D# between D-E (pos 3), F# between F-G (pos 6), G# between G-A (pos 8), A# between A-B (pos 10)
            const blackPosMap = { 1: 1, 3: 2, 6: 3, 8: 4, 10: 5 };
            const bp = blackPosMap[posInOctave] || 3;
            const wkWidth = 38; // 36 + 2 margin
            const left = (bp - 1) * wkWidth + wkWidth - 11;
            el.style.left = left + 'px';
        }

        return el;
    }

    // Build white keys
    const whiteKeyEls = [];
    allWhite.forEach(note => {
        const el = createKey(note, false);
        kb.appendChild(el);
        whiteKeyEls.push(el);
    });

    // Build black keys
    const blackNoteList = [];
    for (let oct = 3; oct <= 4; oct++) {
        ['C#','D#','F#','G#','A#'].forEach(b => blackNoteList.push(b+oct));
    }
    blackNoteList.forEach(note => {
        const el = createKey(note, true);
        kb.appendChild(el);
    });

    // Mouse events
    const allKeys = kb.querySelectorAll('.wk, .bk');
    let mouseDown = false;

    function pressKey(el) {
        if (!el || el.classList.contains('pressed')) return;
        const note = el.dataset.note;
        el.classList.add('pressed');
        const baseName = note.replace(/[0-9]+/g, '');
        const color = NOTE_COLORS[baseName];
        const glow = el.querySelector('.key-glow');
        if (glow && color) {
            glow.style.background = `radial-gradient(ellipse at center, rgba(${color.r*255|0},${color.g*255|0},${color.b*255|0},0.4) 0%, transparent 70%)`;
        }
        synth.noteOn(note);
        visual.setNoteActive(note, true);
        visual.triggerNoteBurst(note, 0.7);
        updateActiveCount();
    }

    function releaseKey(el) {
        if (!el) return;
        const note = el.dataset.note;
        el.classList.remove('pressed');
        synth.noteOff(note);
        visual.setNoteActive(note, false);
        updateActiveCount();
    }

    allKeys.forEach(el => {
        el.addEventListener('mousedown', e => {
            e.preventDefault();
            mouseDown = true;
            synth.resume();
            pressKey(el);
        });
        el.addEventListener('mouseenter', () => {
            if (mouseDown && !el.classList.contains('pressed')) {
                pressKey(el);
            }
        });
        el.addEventListener('mouseleave', () => {
            if (el.classList.contains('pressed')) {
                releaseKey(el);
            }
        });
    });
    document.addEventListener('mouseup', () => {
        mouseDown = false;
    });

    // Touch
    kb.addEventListener('touchstart', e => {
        e.preventDefault();
        synth.resume();
        const touch = e.changedTouches[0];
        const el = document.elementFromPoint(touch.clientX, touch.clientY);
        if (el && (el.classList.contains('wk') || el.classList.contains('bk'))) {
            pressKey(el);
        }
    }, { passive: false });
    kb.addEventListener('touchmove', e => {
        e.preventDefault();
        const touch = e.changedTouches[0];
        const el = document.elementFromPoint(touch.clientX, touch.clientY);
        // Release all
        allKeys.forEach(k => {
            if (k.classList.contains('pressed') && k !== el) releaseKey(k);
        });
        if (el && (el.classList.contains('wk') || el.classList.contains('bk'))) {
            if (!el.classList.contains('pressed')) pressKey(el);
        }
    }, { passive: false });
    kb.addEventListener('touchend', e => {
        e.preventDefault();
        allKeys.forEach(k => {
            if (k.classList.contains('pressed')) releaseKey(k);
        });
    }, { passive: false });

    // Computer keyboard
    document.addEventListener('keydown', e => {
        if (e.repeat) return;
        if (e.target.tagName === 'INPUT') return;
        const note = KEYBOARD_MAP[e.key.toLowerCase()];
        if (note) {
            e.preventDefault();
            synth.resume();
            const el = document.querySelector(`[data-note="${note}"]`);
            if (el && !el.classList.contains('pressed')) {
                pressKey(el);
            }
        }
    });
    document.addEventListener('keyup', e => {
        const note = KEYBOARD_MAP[e.key.toLowerCase()];
        if (note) {
            const el = document.querySelector(`[data-note="${note}"]`);
            if (el) releaseKey(el);
        }
    });

    function updateActiveCount() {
        document.getElementById('active-count').textContent = visual.activeNotes.size;
    }
}

    synth.setVolume(val);
});

// ─── VISION MODE ────────────────────────────────────────────────
let visionMode = 'default';
document.getElementById('btn-vision').addEventListener('click', () => {
    const modes = ['default', 'wireframe', 'particles'];
    const idx = (modes.indexOf(visionMode) + 1) % modes.length;
    visionMode = modes[idx];
    document.getElementById('btn-vision').textContent = 'Visuales: ' + visionMode;
    if (visionMode === 'wireframe') {
        visual.torusKnot.material.wireframe = true;
        visual.nebulaParticles.material.size = 0.03;
    } else if (visionMode === 'particles') {
        visual.torusKnot.material.wireframe = false;
        visual.torusKnot.material.opacity = 0.2;
        visual.nebulaParticles.material.size = 0.15;
    } else {
        visual.torusKnot.material.wireframe = false;
        visual.torusKnot.material.opacity = 0.9;
        visual.nebulaParticles.material.size = 0.08;
    }
});

// ─── FULLSCREEN ─────────────────────────────────────────────────
document.getElementById('btn-fullscreen').addEventListener('click', () => {

    }
});

// ─── ANIMATION LOOP ─────────────────────────────────────────────
let lastTime = performance.now();

function animate(time) {
    const dt = Math.min((time - lastTime) / 1000, 0.05);
    lastTime = time;

    const audioData = synth.getAnalyserData();
    visual.update(audioData, dt);

    // BPM indicator
    const avgEnergy = audioData.freq.reduce((a,b) => a+b, 0) / audioData.freq.length / 255;
    const dot = document.getElementById('note-indicator');
    if (avgEnergy > 0.12) {
        dot.classList.add('active');
    } else {
        dot.classList.remove('active');
    }

    requestAnimationFrame(animate);
}

// ─── START ──────────────────────────────────────────────────────
// Initialize audio context on first user interaction
function firstInteraction() {
    synth.init();
    document.removeEventListener('click', firstInteraction);
    document.removeEventListener('keydown', firstInteraction);
    document.removeEventListener('touchstart', firstInteraction);
    // Hide loading
    document.getElementById('loading').classList.add('hidden');
}

document.addEventListener('click', firstInteraction);
document.addEventListener('keydown', firstInteraction);
document.addEventListener('touchstart', firstInteraction);

// Start animation loop even before audio
requestAnimationFrame(animate);

console.log('✦ Nebulosa Sonora — Sintetizador Sinestésico 3D');
console.log('  Teclado: Z-M (octava baja) + Q-] (octava alta)');
console.log('  Negras: S, D, G, H, J | 2, 3, 5, 6, 7');
