<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const ROUND_TEX=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const ctx=c.getContext('2d');const g=ctx.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(0.15,'rgba(255,255,255,0.7)');g.addColorStop(0.4,'rgba(255,255,255,0.25)');g.addColorStop(0.7,'rgba(255,255,255,0.05)');g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)})();
const NOTE_NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const WHITE_BASES=['C','D','E','F','G','A','B'];const BLACK_BASES=['C#','D#','F#','G#','A#'];
const ALL_NOTES=[];for(let o=3;o<=4;o++)WHITE_BASES.forEach(w=>ALL_NOTES.push(w+o));
const NOTE_COLORS={'C':new THREE.Color(0.80,0.30,0.30),'D':new THREE.Color(0.85,0.55,0.20),'E':new THREE.Color(0.70,0.70,0.25),'F':new THREE.Color(0.25,0.70,0.40),'G':new THREE.Color(0.20,0.60,0.80),'A':new THREE.Color(0.50,0.35,0.85),'B':new THREE.Color(0.75,0.30,0.65)};
const WHITE_KEYS_ROW=['a','s','d','f','g','h','j'];const BLACK_KEYS_ROW=['w','e','t','y','u'];
const KEYBOARD_MAP={
    // Octave 3: bottom row white + top row black
    'z':'C3','x':'D3','c':'E3','v':'F3','b':'G3','n':'A3','m':'B3',
    'q':'C#3','w':'D#3','e':'F#3','r':'G#3','t':'A#3',
    // Octave 4: home row white + number row black
    'a':'C4','s':'D4','d':'E4','f':'F4','g':'G4','h':'A4','j':'B4',
    '1':'C#4','2':'D#4','4':'F#4','5':'G#4','6':'A#4',
    // Octave 5 partial
    'k':'C5','l':'D5',';':'E5',"'":'F5','8':'C#5','9':'D#5','-':'F#5','=':'G#5',
};
const BASE_TO_KEY={};WHITE_KEYS_ROW.forEach((k,i)=>{BASE_TO_KEY[WHITE_BASES[i]]=k.toUpperCase()});BLACK_KEYS_ROW.forEach((k,i)=>{BASE_TO_KEY[BLACK_BASES[i]]=k.toUpperCase()});
// Reverse map: note -> computer key
const NOTE_TO_KEY={};for(const[k,v]of Object.entries(KEYBOARD_MAP)){NOTE_TO_KEY[v]=k.toUpperCase()}

function notePos(note,r=3){const i=ALL_NOTES.indexOf(note),a=(i/ALL_NOTES.length)*Math.PI*2;return new THREE.Vector3(Math.cos(a)*r,0.3+Math.sin(a*2.3)*0.5,Math.sin(a)*r)}
function freq(n){const a=NOTE_NAMES.indexOf(n.replace(/[0-9]/g,''));if(a===-1)return 440;return 440*Math.pow(2,((parseInt(n.replace(/[A-Z#]+/g,''))-4)*12+a)/12)}

// ─── SYNTH ──────────────────────────────────────────────────────
class SynthEngine{
    constructor(){this.ctx=null;this.masterGain=null;this.analyser=null;this.active=new Map();this.preset='nebula';this.vol=0.65;this.freqData=null;this.timeData=null;this.initd=false;this.delay=null;this.flangeLFO=null}
    init(){
        if(this.initd)return;this.ctx=new AudioContext();this.masterGain=this.ctx.createGain();this.masterGain.gain.value=this.vol;
        // Shared delay/reverb bus
        this.delay=this.ctx.createDelay(1.5);this.delay.delayTime.value=0.3;
        this.delayFB=this.ctx.createGain();this.delayFB.gain.value=0;
        this.delayMix=this.ctx.createGain();this.delayMix.gain.value=0;
        this.delay.connect(this.delayFB);this.delayFB.connect(this.delay);
        this.delay.connect(this.delayMix);this.delayMix.connect(this.masterGain);
        // Shared flanger LFO
        this.flangeLFO=this.ctx.createOscillator();this.flangeLFO.type='sine';this.flangeLFO.frequency.value=0.15;
        this.flangeGain=this.ctx.createGain();this.flangeGain.gain.value=0;
        this.flangeLFO.connect(this.flangeGain);this.flangeLFO.start();
        this.analyser=this.ctx.createAnalyser();this.analyser.fftSize=256;
        this.freqData=new Uint8Array(this.analyser.frequencyBinCount);this.timeData=new Uint8Array(this.analyser.frequencyBinCount);
        this.masterGain.connect(this.analyser);this.analyser.connect(this.ctx.destination);
        this.initd=true;
    }
    resume(){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume()}
    setVolume(v){this.vol=v;if(this.masterGain)this.masterGain.gain.setTargetAtTime(v,this.ctx.currentTime,0.05)}
    setPreset(p){this.preset=p;if(this.delayFB)this.delayFB.gain.value=0;if(this.flangeGain)this.flangeGain.gain.value=0;if(this.delayMix)this.delayMix.gain.value=0}
    config(){
        const c={
            nebula:{osc:['sawtooth','sine'],detune:7,filter:1200,attack:0.02,release:0.6,sub:0.25,chorus:true,delay:0,flange:0},
            cristal:{osc:['sine','sine'],detune:12,filter:3000,attack:0.01,release:0.9,sub:0,chorus:true,delay:0,flange:0},
            percusion:{osc:['triangle','sine'],detune:3,filter:8000,attack:0.001,release:0.08,sub:0,chorus:false,delay:0,flange:0},
            glocken:{osc:['sine','sine'],detune:0,filter:12000,attack:0.0005,release:0.15,sub:0,chorus:false,delay:0,flange:0},
            staccato:{osc:['square','triangle'],detune:1,filter:4000,attack:0.0005,release:0.02,sub:0,chorus:false,delay:0,flange:0},
            psicodelico:{osc:['sawtooth','sawtooth'],detune:25,filter:3000,attack:0.1,release:1.5,sub:0.15,chorus:true,delay:0.5,flange:0},
            flanger:{osc:['sawtooth','triangle'],detune:3,filter:5000,attack:0.005,release:0.4,sub:0,chorus:false,delay:0,flange:0.003},
            subgrave:{osc:['sine','triangle'],detune:5,filter:600,attack:0.03,release:0.8,sub:0.6,chorus:false,delay:0,flange:0},
        };return c[this.preset]
    }
    noteOn(note,vel=0.7){
        if(!this.ctx||!this.masterGain)return;
        if(this.active.has(note)){const o=this.active.get(note);if(o.timer)clearTimeout(o.timer);o.nodes.forEach(n=>{try{n.stop()}catch(e){}try{n.disconnect()}catch(e){}});this.active.delete(note)}
        const cfg=this.config(),f=freq(note),now=this.ctx.currentTime;
        const g={nodes:[],gain:null,filter:null,timer:null};

        // Sub
        if(cfg.sub>0){const s=this.ctx.createOscillator();s.type='sine';s.frequency.value=f*0.5;const sg=this.ctx.createGain();sg.gain.value=cfg.sub*vel*0.18;s.connect(sg);sg.connect(this.masterGain);s.start(now);g.nodes.push(s,sg)}

        // Filter
        const flt=this.ctx.createBiquadFilter();flt.type='lowpass';flt.frequency.value=cfg.filter;flt.Q.value=2;g.filter=flt;
        const mg=this.ctx.createGain();mg.gain.value=0;g.gain=mg;

        // Oscillators

        // Psychedelic: slow tremolo LFO on gain
        if(this.preset==='psicodelico'){
            const tl=this.ctx.createOscillator();tl.type='sine';tl.frequency.value=2.5;

            tl.connect(tg);tg.connect(mg.gain);tl.start(now);g.nodes.push(tl,tg);

            const fl=this.ctx.createOscillator();fl.type='sine';fl.frequency.value=0.3;

    noteOff(note){
        const g=this.active.get(note);if(!g)return;

    }

    data(){if(!this.analyser)return{freq:new Uint8Array(128),time:new Uint8Array(128)};this.analyser.getByteFrequencyData(this.freqData);this.analyser.getByteTimeDomainData(this.timeData);return{freq:this.freqData,time:this.timeData}}
}

// ─── BRANCHES ───────────────────────────────────────────────────
class Branches{
    constructor(s,n=24){this.s=s;this.b=new Map();this.mv=n*200*2;const g=new THREE.BufferGeometry();this.p=new Float32Array(this.mv*3);this.c=new Float32Array(this.mv*3);g.setAttribute('position',new THREE.BufferAttribute(this.p,3));g.setAttribute('color',new THREE.BufferAttribute(this.c,3));this.m=new THREE.LineSegments(g,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:0.35,blending:THREE.AdditiveBlending,depthWrite:false}));this.m.frustumCulled=false;this.m.visible=false;s.add(this.m);this.vc=0}

// ─── UI ─────────────────────────────────────────────────────────
const NOTE_LABELS={'C':'Do','D':'Re','E':'Mi','F':'Fa','G':'Sol','A':'La','B':'Si'};

const kb=document.getElementById('keyboard');const wNotes=ALL_NOTES.filter(n=>/^[A-G][0-9]$/.test(n));
function makeKey(note,black){
    const el=document.createElement('div');el.className=black?'bk':'wk';el.dataset.note=note;
    const gl=document.createElement('div');gl.className='key-glow';el.appendChild(gl);
    const base=note.replace(/[0-9]+/g,'');const oct=parseInt(note.replace(/[A-Z#]+/g,''));
    if(!black){const nl=document.createElement('div');nl.className='note-label';nl.textContent=NOTE_LABELS[base]||'';el.appendChild(nl)}
    const kl=document.createElement('div');kl.className='key-label';kl.textContent=NOTE_TO_KEY[note]||'';el.appendChild(kl);
    if(black){const p=NOTE_NAMES.indexOf(base),wi={1:0,3:1,6:3,8:4,10:5}[p];if(wi!==undefined)el.style.left=((wi+1)*38-11+266*(oct-3))+'px'}
    return el;
}
wNotes.forEach(n=>kb.appendChild(makeKey(n,false)));for(let o=3;o<=4;o++)BLACK_BASES.forEach(b=>kb.appendChild(makeKey(b+o,true)));
const allKeys=kb.querySelectorAll('.wk,.bk');const pressed=new Set();let mouseDown=false;

    if(!el||el.classList.contains('pressed'))return;const n=el.dataset.note;el.classList.add('pressed');pressed.add(el);
    const c=NOTE_COLORS[n.replace(/[0-9]+/g,'')],g=el.querySelector('.key-glow');
    if(g&&c)g.style.background=`radial-gradient(ellipse at center, rgba(${c.r*255|0},${c.g*255|0},${c.b*255|0},0.3) 0%, transparent 70%)`;
    synth.noteOn(n);vis.setNote(n,true);vis.triggerBurst(n,0.6);
    document.getElementById('active-count').textContent=vis.active.size;
}
function release(el){if(!el)return;el.classList.remove('pressed');pressed.delete(el);const n=el.dataset.note;synth.noteOff(n);vis.setNote(n,false);document.getElementById('active-count').textContent=vis.active.size}

allKeys.forEach(el=>{
    el.addEventListener('mousedown',e=>{e.preventDefault();synth.resume();mouseDown=true;press(el)});
    el.addEventListener('mouseenter',()=>{if(mouseDown&&!el.classList.contains('pressed'))press(el)});
    el.addEventListener('mouseleave',()=>{if(pressed.has(el))release(el)});
});
document.addEventListener('mouseup',releaseAll);
kb.addEventListener('touchstart',e=>{e.preventDefault();synth.resume();const t=e.changedTouches[0];const el=document.elementFromPoint(t.clientX,t.clientY);if(el&&(el.classList.contains('wk')||el.classList.contains('bk')))press(el)},{passive:false});
kb.addEventListener('touchmove',e=>{e.preventDefault();const t=e.changedTouches[0];const el=document.elementFromPoint(t.clientX,t.clientY);pressed.forEach(k=>{if(k!==el)release(k)});if(el&&(el.classList.contains('wk')||el.classList.contains('bk'))&&!el.classList.contains('pressed'))press(el)},{passive:false});

document.addEventListener('keydown',e=>{
    if(e.repeat||e.target.tagName==='INPUT')return;
    // Note: comma/period no longer shift octave - keyboard is fixed 2-octave mapping
    const n=KEYBOARD_MAP[e.key.toLowerCase()];
    if(n){e.preventDefault();synth.resume();const el=document.querySelector(`[data-note="${n}"]`);if(el&&!el.classList.contains('pressed'))press(el)}
});
document.addEventListener('keyup',e=>{
    const n=KEYBOARD_MAP[e.key.toLowerCase()];if(n){const el=document.querySelector(`[data-note="${n}"]`);if(el)release(el)}
});
window.addEventListener('blur',()=>{synth.allOff();document.querySelectorAll('.pressed').forEach(el=>{el.classList.remove('pressed');const n=el.dataset.note;vis.setNote(n,false)});pressed.clear();document.getElementById('active-count').textContent='0'});
document.querySelectorAll('.preset-btn').forEach(b=>{b.addEventListener('click',()=>{document.querySelectorAll('.preset-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');synth.setPreset(b.dataset.preset);synth.allOff()})});
document.getElementById('volume-slider').addEventListener('input',e=>synth.setVolume(e.target.value/100));
let vm=0;document.getElementById('btn-mode').addEventListener('click',()=>{vm=(vm+1)%3;document.getElementById('btn-mode').textContent=['⊙','◇','△'][vm];const w=[0.06,0.2,0.03],n=[0.08,0.3,0.04];vis.cw1.material.opacity=w[vm];vis.cw2.material.opacity=w[vm]*0.6;vis.neb.material.size=n[vm];vis.cp.material.size=[0.04,0.12,0.02][vm]});
document.getElementById('btn-fullscreen').addEventListener('click',()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen()});
let lt=performance.now();function anim(t){const dt=Math.min((t-lt)/1000,0.05);lt=t;vis.update(synth.data(),dt);const dot=document.getElementById('note-indicator');if(vis.active.size>0)dot.classList.add('active');else dot.classList.remove('active');requestAnimationFrame(anim)}
requestAnimationFrame(anim);
function first(){synth.init();document.getElementById('loading').classList.add('hidden')}
document.addEventListener('click',first);document.addEventListener('keydown',first);document.addEventListener('touchstart',first);
console.log('✦ Nebulosa Sonora — 8 sintes + Bounce + Cámara');
</script>
</body>
