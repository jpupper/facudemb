{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ─── ROUND PARTICLE TEXTURE ─────────────────────────────────────
function makeCircleTex() {
    const c = document.createElement('canvas');
    c.width = c.height = 64;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.1, 'rgba(255,255,255,0.9)');
    g.addColorStop(0.35, 'rgba(255,255,255,0.4)');
    g.addColorStop(0.7, 'rgba(255,255,255,0.08)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(c);
}
const ROUND_TEX = makeCircleTex();

// ─── NOTES ──────────────────────────────────────────────────────
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const WHITE_BASES = ['C','D','E','F','G','A','B'];
const BLACK_BASES = ['C#','D#','F#','G#','A#'];
function freqFromNote(note) {
    const n = NOTE_NAMES.indexOf(note.replace(/[0-9]/g,'')); if (n === -1) return 440;
    const oct = parseInt(note.replace(/[A-Z#]+/g,'')); return 440 * Math.pow(2, ((oct-4)*12 + n) / 12);
}
const ALL_NOTES = [];
for (let oct = 3; oct <= 4; oct++) WHITE_BASES.forEach(w => ALL_NOTES.push(w+oct));

// Color palette: refined pastel-neon synesthesia
const NOTE_COLORS = {
    'C': new THREE.Color(0.95, 0.25, 0.25),
    'D': new THREE.Color(1.00, 0.55, 0.10),
    'E': new THREE.Color(0.85, 0.85, 0.15),
    'F': new THREE.Color(0.20, 0.85, 0.35),
    'G': new THREE.Color(0.15, 0.75, 0.90),
    'A': new THREE.Color(0.50, 0.35, 1.00),
    'B': new THREE.Color(0.90, 0.25, 0.80),
};

// ─── KEYBOARD MAPPING ──────────────────────────────────────────
const WHITE_KEYS_ROW = ['a','s','d','f','g','h','j'];
const BLACK_KEYS_ROW = ['w','e','t','y','u'];
let CURRENT_OCTAVE = 3;
let KEYBOARD_MAP = {};
function buildKeyMap(oct) {
    const m = {};
    WHITE_KEYS_ROW.forEach((k, i) => { m[k] = WHITE_BASES[i] + oct; });
    BLACK_KEYS_ROW.forEach((k, i) => { m[k] = BLACK_BASES[i] + oct; });
    return m;
}
KEYBOARD_MAP = buildKeyMap(CURRENT_OCTAVE);

// Key label for each BASE note
const BASE_TO_KEY = {};
WHITE_KEYS_ROW.forEach((k, i) => { BASE_TO_KEY[WHITE_BASES[i]] = k.toUpperCase(); });
BLACK_KEYS_ROW.forEach((k, i) => { BASE_TO_KEY[BLACK_BASES[i]] = k.toUpperCase(); });

function note3DPos(note, radius = 3) {
    const idx = ALL_NOTES.indexOf(note);
    const angle = (idx / ALL_NOTES.length) * Math.PI * 2;
    return new THREE.Vector3(Math.cos(angle)*radius, 0.3 + Math.sin(angle*2.3)*0.8, Math.sin(angle)*radius);
}

// ─── SYNTH ENGINE ──────────────────────────────────────────────
class SynthEngine {
    constructor() {
        this.ctx = null; this.masterGain = null; this.analyser = null;
        this.activeNodes = new Map(); this.preset = 'nebula';
        this.volume = 0.7; this.freqData = null; this.timeData = null; this.initialized = false;
    }
    init() {
        if (this.initialized) return;
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.masterGain = this.ctx.createGain(); this.masterGain.gain.value = this.volume;
        this.analyser = this.ctx.createAnalyser(); this.analyser.fftSize = 256;
        this.freqData = new Uint8Array(this.analyser.frequencyBinCount);
        this.timeData = new Uint8Array(this.analyser.frequencyBinCount);
        this.masterGain.connect(this.analyser); this.analyser.connect(this.ctx.destination);
        this.initialized = true;
    }
    resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); }
    setVolume(v) { this.volume = v; if (this.masterGain) this.masterGain.gain.setTargetAtTime(v, this.ctx.currentTime, 0.05); }
    setPreset(p) { this.preset = p; }
    getPresetConfig() {
        return ({
            nebula: { oscTypes:['sawtooth','sine'], detune:7, filter:1200, attack:0.015, release:0.7, sub:0.3, chorus:true },
            crystal:{ oscTypes:['sine','sine'], detune:12, filter:3000, attack:0.008, release:1.0, sub:0, chorus:true },
            bass:   { oscTypes:['sawtooth','square'], detune:3, filter:400, attack:0.03, release:0.6, sub:0.5, chorus:false },
            pad:    { oscTypes:['sine','triangle'], detune:8, filter:2000, attack:0.3, release:2.0, sub:0.2, chorus:true },
            lead:   { oscTypes:['square','sawtooth'], detune:5, filter:2500, attack:0.008, release:0.5, sub:0, chorus:false },
        })[this.preset];
    }
    noteOn(note, velocity=0.7) {
        if (!this.ctx || !this.masterGain) return;
        if (this.activeNodes.has(note)) this.noteOff(note);
        const freq = freqFromNote(note);
        const cfg = this.getPresetConfig();
        const now = this.ctx.currentTime;
        const g = { nodes:[], gain:null, filter:null, stopTimer:null };

        if (cfg.sub > 0) {
            const sub = this.ctx.createOscillator(); sub.type='sine'; sub.frequency.value=freq*0.5;
            const subG = this.ctx.createGain(); subG.gain.value=cfg.sub*velocity*0.2;
            sub.connect(subG); subG.connect(this.masterGain); sub.start(now);
            g.nodes.push(sub, subG);
        }
        const filter = this.ctx.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value=cfg.filter; filter.Q.value=2;
        g.filter = filter;
        const mixG = this.ctx.createGain(); mixG.gain.value=0; g.gain = mixG;
        cfg.oscTypes.forEach((type, i) => {
            const osc = this.ctx.createOscillator(); osc.type=type; osc.frequency.value=freq+(i===1?cfg.detune:0);
            const og = this.ctx.createGain(); og.gain.value=velocity*(0.4/cfg.oscTypes.length);
            osc.connect(og); og.connect(filter); g.nodes.push(osc, og); osc.start(now);
        });
        if (cfg.chorus) {
            const lfo = this.ctx.createOscillator(); lfo.type='sine'; lfo.frequency.value=3.5;
            const lg = this.ctx.createGain(); lg.gain.value=2; lfo.connect(lg); lg.connect(filter.frequency); lfo.start(now);
            g.nodes.push(lfo, lg);
        }
        filter.connect(mixG); mixG.connect(this.masterGain);
        mixG.gain.setValueAtTime(0, now);
        mixG.gain.linearRampToValueAtTime(velocity*0.55, now+cfg.attack);
        filter.frequency.setValueAtTime(80, now);
        filter.frequency.exponentialRampToValueAtTime(cfg.filter, now+cfg.attack+0.06);
        this.activeNodes.set(note, g);
    }
    noteOff(note) {
        const g = this.activeNodes.get(note); if (!g) return;
        const cfg = this.getPresetConfig();
        const now = this.ctx.currentTime;
        const release = cfg.release || 0.5;
        if (g.gain && g.gain.gain) {
            g.gain.gain.cancelScheduledValues(now);
            g.gain.gain.setValueAtTime(g.gain.gain.value, now);
            g.gain.gain.exponentialRampToValueAtTime(0.0001, now + release);
        }
        if (g.filter) {
            g.filter.frequency.cancelScheduledValues(now);
            g.filter.frequency.setValueAtTime(g.filter.frequency.value, now);
            g.filter.frequency.exponentialRampToValueAtTime(10, now + release * 0.8);
        }
        g.stopTimer = setTimeout(() => {
            g.nodes.forEach(n => { try { n.stop(); } catch(e){} try { n.disconnect(); } catch(e){} });
            this.activeNodes.delete(note);
        }, (release + 0.1) * 1000);
    }
    allNotesOff() { this.activeNodes.forEach((g, note) => this.noteOff(note)); }
    getAnalyserData() {
        if (!this.analyser) return {freq:new Uint8Array(128), time:new Uint8Array(128)};
        this.analyser.getByteFrequencyData(this.freqData);
        this.analyser.getByteTimeDomainData(this.timeData);
        return {freq:this.freqData, time:this.timeData};
    }
}

// ─── BRANCH SYSTEM ──────────────────────────────────────────────
class BranchSystem {
    constructor(scene, maxNotes=24) {
        this.scene = scene;
        this.branches = new Map();
        this.maxVerts = maxNotes * 200 * 2;
        const geo = new THREE.BufferGeometry();
        this.posArr = new Float32Array(this.maxVerts*3);
        this.colArr = new Float32Array(this.maxVerts*3);
        geo.setAttribute('position', new THREE.BufferAttribute(this.posArr,3));
        geo.setAttribute('color', new THREE.BufferAttribute(this.colArr,3));
        this.mat = new THREE.LineBasicMaterial({ vertexColors:true, transparent:true, opacity:0.7, blending:THREE.AdditiveBlending, depthWrite:false });
        this.mesh = new THREE.LineSegments(geo, this.mat);
        this.mesh.frustumCulled = false; this.mesh.visible = false;
        scene.add(this.mesh);
        this.vertCount = 0;
    }
    noteOn(note) {
        if (this.branches.has(note)) return;
        const color = NOTE_COLORS[note.replace(/[0-9]+/g,'')] || new THREE.Color(0.5,0.5,0.5);
        const target = note3DPos(note);
        const seed = ALL_NOTES.indexOf(note) * 137.508;
        const segs = [];
        this._genBranch(segs, new THREE.Vector3(0,0.5,0), target, 3, 0, seed);
        this.branches.set(note, { note, color:color.clone(), target, segments:segs, progress:0, active:true });
    }
    _genBranch(segs, start, end, depth, idx, seed) {
        if (depth <= 0) return;
        segs.push({start:start.clone(), end:end.clone(), depth});
        if (depth > 1) {
            const t = [0.3, 0.6][idx%2];
            const mid = start.clone().lerp(end, t);
            const n = depth === 3 ? 2 : 1;
            for (let i = 0; i < n; i++) {
                const dir = new THREE.Vector3(
                    Math.sin(seed+idx*7.3+i*13.7)*1.5, Math.cos(seed+idx*11.2+i*5.3)*0.8, Math.cos(seed+idx*3.7+i*9.1)*1.5
                ).normalize();
                const subEnd = mid.clone().add(dir.multiplyScalar(end.distanceTo(start)*(0.35+Math.random()*0.15)));
                this._genBranch(segs, mid, subEnd, depth-1, idx+1, seed+i*47);
            }
        }
    }
    noteOff(note) { const b = this.branches.get(note); if (b) b.active = false; }
    update(dt) {
        let vi = 0;
        this.branches.forEach((b) => {
            if (!b.active) { b.progress -= dt*1.2; if (b.progress <= 0) { this.branches.delete(b.note); return; } }
            else b.progress = Math.min(1, b.progress + dt*1.5);
            const p = b.progress; const alpha = Math.min(1, p*2);
            const c = new THREE.Vector3(0,0.5,0);
            b.segments.forEach((seg, si) => {
                const segP = si/b.segments.length; if (segP > p) return;
                if (vi+2 > this.maxVerts) return;
                const growth = Math.min(1, p*2 - segP);
                const sPos = seg.start.clone().lerp(c, 1-Math.min(1,growth*1.5));
                const ePos = seg.end.clone().lerp(c, 1-Math.min(1,growth*1.5));
                this.posArr[vi*3]=sPos.x; this.posArr[vi*3+1]=sPos.y; this.posArr[vi*3+2]=sPos.z;
                this.posArr[vi*3+3]=ePos.x; this.posArr[vi*3+4]=ePos.y; this.posArr[vi*3+5]=ePos.z;
                const fade = Math.max(0,1-segP*0.5)*alpha*(b.active?1:Math.max(0,p*2));
                const c2 = b.color.clone().multiplyScalar(fade);
                this.colArr[vi*3]=c2.r; this.colArr[vi*3+1]=c2.g; this.colArr[vi*3+2]=c2.b;
                this.colArr[vi*3+3]=c2.r; this.colArr[vi*3+4]=c2.g; this.colArr[vi*3+5]=c2.b;
                vi += 2;
            });
        });
        this.vertCount = vi;
        if (vi > 0) {
            this.mesh.visible = true;
            this.mesh.geometry.attributes.position.needsUpdate = true;
            this.mesh.geometry.attributes.color.needsUpdate = true;
            this.mesh.geometry.setDrawRange(0, vi);
        } else this.mesh.visible = false;
    }
}

// ─── 3D SCENE ───────────────────────────────────────────────────
class VisualScene {
    constructor(container) {
        this.container = container;
        this.activeNotes = new Set();
        this.bursts = [];
        this.audioHistory = [];

        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x050510);

        const w=innerWidth, h=innerHeight;
        this.camera = new THREE.PerspectiveCamera(60, w/h, 0.1, 100);
        this.camera.position.set(0, 1.5, 8);

        this.renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
        this.renderer.setSize(w, h);
        this.renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
        this.renderer.toneMappingExposure = 1.2;
        container.appendChild(this.renderer.domElement);

        this.composer = new EffectComposer(this.renderer);
        this.composer.addPass(new RenderPass(this.scene, this.camera));
        this.bloom = new UnrealBloomPass(new THREE.Vector2(w, h), 0.5, 0.3, 0.12);
        this.composer.addPass(this.bloom);

        this.controls = new OrbitControls(this.camera, this.renderer.domElement);
        this.controls.enableDamping = true;
        this.controls.dampingFactor = 0.05;
        this.controls.autoRotate = true;
        this.controls.autoRotateSpeed = 0.6;
        this.controls.target.set(0, 0.3, 0);
        this.controls.maxPolarAngle = Math.PI/2.2;
        this.controls.minDistance = 3;
        this.controls.maxDistance = 18;

        this.buildScene();
        addEventListener('resize', () => this.onResize());
    }

    buildScene() {
        const S = this.scene;

        // Lights
        S.add(new THREE.AmbientLight(0x111133, 0.3));
        const dir = new THREE.DirectionalLight(0x8899cc, 0.8); dir.position.set(3,8,4); S.add(dir);

        // 3 orbiting colored lights
        this.orbitLights = [];
        for (let i=0;i<3;i++) {
            const pl = new THREE.PointLight([0xff3366,0x33ff66,0x3366ff][i], 1.2, 12);
            pl.position.set(Math.cos(i*2.094)*4, 0.3+Math.sin(i*1.3)*1, Math.sin(i*2.094)*4);
            S.add(pl);
            this.orbitLights.push({light:pl, angle:i*2.094, speed:0.3+i*0.08, color:new THREE.Color([0xff3366,0x33ff66,0x3366ff][i])});
        }

        // ─── Stars ───
        const sN=3000; const sGeo=new THREE.BufferGeometry(); const sP=new Float32Array(sN*3);
        for (let i=0;i<sN;i++) {
            const t=Math.random()*Math.PI*2, p=Math.acos(2*Math.random()-1), r=20+Math.random()*30;
            sP[i*3]=r*Math.sin(p)*Math.cos(t); sP[i*3+1]=r*Math.cos(p)*(0.3+Math.random()*0.7); sP[i*3+2]=r*Math.sin(p)*Math.sin(t);
        }
        sGeo.setAttribute('position', new THREE.BufferAttribute(sP,3));
        this.stars = new THREE.Points(sGeo, new THREE.PointsMaterial({map:ROUND_TEX, size:0.25, transparent:true, opacity:0.7, blending:THREE.AdditiveBlending, depthWrite:false, color:0x8899cc}));
        S.add(this.stars);

        // ─── Nebula particles ───
        const nN=1500; const nGeo=new THREE.BufferGeometry(); const nP=new Float32Array(nN*3); const nC=new Float32Array(nN*3);
        for (let i=0;i<nN;i++) {
            const t=Math.random()*Math.PI*2, p=Math.acos(2*Math.random()-1), r=0.5+Math.random()*3.5;
            nP[i*3]=r*Math.sin(p)*Math.cos(t); nP[i*3+1]=r*Math.cos(p)*(0.5+Math.random()*0.5); nP[i*3+2]=r*Math.sin(p)*Math.sin(t);
            const c=new THREE.Color().setHSL(0.55+Math.random()*0.3, 0.6, 0.3+Math.random()*0.3);
            nC[i*3]=c.r; nC[i*3+1]=c.g; nC[i*3+2]=c.b;
        }
        nGeo.setAttribute('position', new THREE.BufferAttribute(nP,3));
        nGeo.setAttribute('color', new THREE.BufferAttribute(nC,3));
        this.nebula = new THREE.Points(nGeo, new THREE.PointsMaterial({map:ROUND_TEX, size:0.12, vertexColors:true, transparent:true, opacity:0.5, blending:THREE.AdditiveBlending, depthWrite:false}));
        S.add(this.nebula);
        this.nebulaPos = nP;

        // ─── ENERGY CORE (replaces torus knot) ───
        this.core = new THREE.Group();
        this.core.position.y = 0.4;

        // Layer 1: Outer geodesic wireframe (icosahedron sub 2)
        const ico1 = new THREE.IcosahedronGeometry(1.0, 2);
        const edge1 = new THREE.EdgesGeometry(ico1);
        this.coreWire1 = new THREE.LineSegments(edge1, new THREE.LineBasicMaterial({color:0x4488ff, transparent:true, opacity:0.12, blending:THREE.AdditiveBlending}));
        this.core.add(this.coreWire1);

        // Layer 2: Mid wireframe (sub 1, slightly larger)
        const ico2 = new THREE.IcosahedronGeometry(1.15, 1);
        const edge2 = new THREE.EdgesGeometry(ico2);
        this.coreWire2 = new THREE.LineSegments(edge2, new THREE.LineBasicMaterial({color:0x88ccff, transparent:true, opacity:0.08, blending:THREE.AdditiveBlending}));
        this.core.add(this.coreWire2);

        // Layer 3: Inner star (octahedron)
        const ico3 = new THREE.OctahedronGeometry(0.6, 0);
        const edge3 = new THREE.EdgesGeometry(ico3);
        this.coreWire3 = new THREE.LineSegments(edge3, new THREE.LineBasicMaterial({color:0xff88cc, transparent:true, opacity:0.15, blending:THREE.AdditiveBlending}));
        this.core.add(this.coreWire3);

        // Vertex glow particles (on the outer sphere surface)
        const vN = 400; const vGeo = new THREE.BufferGeometry(); const vP = new Float32Array(vN*3); const vC = new Float32Array(vN*3);
        for (let i=0;i<vN;i++) {
            const t=Math.random()*Math.PI*2, p=Math.acos(2*Math.random()-1), r=0.9+Math.random()*0.15;
            vP[i*3]=r*Math.sin(p)*Math.cos(t); vP[i*3+1]=r*Math.cos(p); vP[i*3+2]=r*Math.sin(p)*Math.sin(t);
            const c=new THREE.Color().setHSL(0.6+Math.random()*0.3, 0.8, 0.5+Math.random()*0.3);
            vC[i*3]=c.r; vC[i*3+1]=c.g; vC[i*3+2]=c.b;
        }
        vGeo.setAttribute('position', new THREE.BufferAttribute(vP,3));
        vGeo.setAttribute('color', new THREE.BufferAttribute(vC,3));
        this.coreParts = new THREE.Points(vGeo, new THREE.PointsMaterial({map:ROUND_TEX, size:0.06, vertexColors:true, transparent:true, opacity:0.7, blending:THREE.AdditiveBlending}));
        this.core.add(this.coreParts);

        // Inner glow sphere
        this.coreGlow = new THREE.Mesh(new THREE.SphereGeometry(0.2,16,16), new THREE.MeshBasicMaterial({color:0x4488ff, transparent:true, opacity:0.4}));
        this.core.add(this.coreGlow);

        // Energy ring around core
        const ringGeo = new THREE.RingGeometry(1.3, 1.32, 48);
        this.coreRing = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({color:0x4488ff, transparent:true, opacity:0.1, side:THREE.DoubleSide, depthWrite:false}));
        this.coreRing.rotation.x = Math.PI/2;
        this.core.add(this.coreRing);

        // Second ring tilted
        const ringGeo2 = new THREE.RingGeometry(1.5, 1.51, 48);
        this.coreRing2 = new THREE.Mesh(ringGeo2, new THREE.MeshBasicMaterial({color:0x88ccff, transparent:true, opacity:0.06, side:THREE.DoubleSide, depthWrite:false}));
        this.coreRing2.rotation.x = Math.PI/3;
        this.coreRing2.rotation.z = Math.PI/4;
        this.core.add(this.coreRing2);

        S.add(this.core);

        // ─── Wave floor ───
        const fGeo = new THREE.PlaneGeometry(18, 18, 48, 48);
        this.floor = new THREE.Mesh(fGeo, new THREE.MeshPhysicalMaterial({
            color:0x0a0a22, emissive:0x08081a, emissiveIntensity:0.2, metalness:0.9, roughness:0.3, transparent:true, opacity:0.35, side:THREE.DoubleSide
        }));
        this.floor.rotation.x=-Math.PI/2; this.floor.position.y=-0.8; S.add(this.floor);
        this.floorPos = fGeo.attributes.position;

        const grid = new THREE.GridHelper(14, 28, 0x224488, 0x113366);
        grid.position.y=-0.79; grid.material.transparent=true; grid.material.opacity=0.1; S.add(grid);

        // ─── BURST PARTICLES ───
        this.MAX_BURSTS=8000;
        const bg=new THREE.BufferGeometry();
        this.bP=new Float32Array(this.MAX_BURSTS*3);
        this.bC=new Float32Array(this.MAX_BURSTS*3);
        this.bS=new Float32Array(this.MAX_BURSTS);
        bg.setAttribute('position', new THREE.BufferAttribute(this.bP,3));
        bg.setAttribute('color', new THREE.BufferAttribute(this.bC,3));
        bg.setAttribute('size', new THREE.BufferAttribute(this.bS,1));
        this.burstMesh = new THREE.Points(bg, new THREE.PointsMaterial({
            map:ROUND_TEX, size:0.4, vertexColors:true, transparent:true, opacity:1,
            blending:THREE.AdditiveBlending, depthWrite:false, sizeAttenuation:true
        }));
        S.add(this.burstMesh);

        // ─── BRANCHES ───
        this.branches = new BranchSystem(S);
    }

    triggerNoteBurst(note, velocity=0.7) {
        const base = note.replace(/[0-9]+/g,'');
        const color = NOTE_COLORS[base] || new THREE.Color(0.5,0.5,0.5);
        const pos = note3DPos(note, 0.5);
        const count = Math.floor(25 + velocity*50);
        for (let i=0; i<count && this.bursts.length<this.MAX_BURSTS; i++) {
            const theta=Math.random()*Math.PI*2, phi=Math.acos(2*Math.random()-1), speed=3+Math.random()*6;
            this.bursts.push({
                x:pos.x, y:pos.y, z:pos.z,
                vx:Math.sin(phi)*Math.cos(theta)*speed,
                vy:Math.cos(phi)*speed+Math.random()*3,
                vz:Math.sin(phi)*Math.sin(theta)*speed,
                r:color.r, g:color.g, b:color.b,
                life:0.8+Math.random()*0.8, maxLife:0.8+Math.random()*0.8,
                size:0.12+Math.random()*0.4
            });
        }
        this.branches.noteOn(note);
    }

    updateBursts(dt) {
        for (let i=this.bursts.length-1; i>=0; i--) {
            const b=this.bursts[i];
            b.x+=b.vx*dt; b.y+=b.vy*dt; b.z+=b.vz*dt;
            b.vy-=2.8*dt; b.vx*=0.98; b.vy*=0.98; b.vz*=0.98;
            b.life-=dt*(0.3+Math.random()*0.15);
            if (b.life<=0) { this.bursts.splice(i,1); continue; }
        }
        const n=Math.min(this.bursts.length, this.MAX_BURSTS);
        for (let i=0;i<n;i++) {
            const b=this.bursts[i];
            const lr=Math.max(0,b.life/b.maxLife);
            this.bP[i*3]=b.x; this.bP[i*3+1]=b.y; this.bP[i*3+2]=b.z;
            const fade=lr*1.2;
            this.bC[i*3]=b.r*fade; this.bC[i*3+1]=b.g*fade; this.bC[i*3+2]=b.b*fade;
            this.bS[i]=Math.max(0.005,b.size*lr);
        }
        this.burstMesh.geometry.attributes.position.needsUpdate=true;
        this.burstMesh.geometry.attributes.color.needsUpdate=true;
        this.burstMesh.geometry.attributes.size.needsUpdate=true;
        this.burstMesh.geometry.setDrawRange(0, n);
    }

    setNoteActive(note, active) {
        if (active) this.activeNotes.add(note);
        else { this.activeNotes.delete(note); this.branches.noteOff(note); }
    }

    update(audioData, dt) {
        const freq=audioData.freq;
        let avg=0, low=0, high=0;
        for (let i=0;i<freq.length;i++) avg+=freq[i]/255; avg/=freq.length;
        for (let i=0;i<8;i++) low+=freq[i]/255; low/=8;
        for (let i=30;i<60;i++) high+=freq[i]/255; high/=30;

        this.audioHistory.push(avg);
        if (this.audioHistory.length>30) this.audioHistory.shift();
        const isBeat = avg > (this.audioHistory.slice(-10).reduce((a,b)=>a+b,0)/10)*1.3 && avg>0.12;

        // Stars
        this.stars.rotation.y += dt*0.015*(0.5+avg);
        this.stars.material.size = 0.25+avg*0.2;

        // Nebula
        const nb=this.nebula.geometry.attributes.position.array;
        for (let i=0;i<nb.length/3;i++) {
            nb[i*3]+=Math.sin(i*0.1+Date.now()*0.0003)*0.0003*(1+avg);
            nb[i*3+1]+=Math.cos(i*0.13+Date.now()*0.0004)*0.0003*(1+avg*0.5);
            nb[i*3+2]+=Math.sin(i*0.17+Date.now()*0.00035)*0.0003*(1+avg);
        }
        this.nebula.geometry.attributes.position.needsUpdate=true;
        this.nebula.material.size = 0.12+low*0.15;
        this.nebula.material.opacity = 0.35+avg*0.3;

        // ─── ENERGY CORE ───
        this.core.rotation.x += dt*0.15*(0.5+high*0.5);
        this.core.rotation.y += dt*0.3*(0.5+avg);
        this.core.rotation.z += dt*0.1*(0.5+low);

        // Color from active notes
        let r=0,g=0,b=0,count=0;
        this.activeNotes.forEach(note=>{
            const c=NOTE_COLORS[note.replace(/[0-9]+/g,'')];
            if (c) {r+=c.r;g+=c.g;b+=c.b;count++;}
        });
        if (count>0) { r/=count;g/=count;b/=count; }
        else { const hue=(Date.now()*0.00004)%1; const c=new THREE.Color().setHSL(hue,0.6,0.5); r=c.r;g=c.g;b=c.b; }

        this.coreWire1.material.color.setRGB(r,g,b);
        this.coreWire1.material.opacity = 0.12+avg*0.15;
        this.coreWire2.material.color.setRGB(r*0.7+0.3,g*0.7+0.3,b*0.7+0.3);
        this.coreWire2.material.opacity = 0.08+avg*0.1;
        this.coreWire3.material.color.setRGB(1-b*0.5,1-g*0.3,1-r*0.5);
        this.coreWire3.material.opacity = 0.12+low*0.15;

        const ts = 1+(isBeat?0.06:0)+low*0.08;
        const cs = this.core.scale.x;
        const ns = cs+(ts-cs)*0.1;
        this.core.scale.set(ns,ns,ns);

        // Core glow
        this.coreGlow.material.color.setRGB(r,g,b);
        this.coreGlow.material.opacity = 0.3+avg*0.4;
        this.coreGlow.scale.setScalar(1+low*0.3);

        // Rings
        this.coreRing.material.color.setRGB(r,g,b);
        this.coreRing.material.opacity = 0.08+avg*0.1;
        this.coreRing.rotation.z += dt*0.2*(0.5+avg);
        this.coreRing2.material.color.setRGB(r*0.5+0.5,g*0.5+0.5,b*0.5+0.5);
        this.coreRing2.material.opacity = 0.05+low*0.06;
        this.coreRing2.rotation.x += dt*0.15*(0.5+avg);
        this.coreRing2.rotation.z += dt*0.1*(0.5+high);

        // Core vertex particles
        this.coreParts.material.opacity = 0.5+avg*0.3;

        // Orbiting lights
        this.orbitLights.forEach((ol,i)=>{
            ol.angle+=dt*ol.speed*(0.5+avg*0.5);
            ol.light.position.set(Math.cos(ol.angle)*4, 0.3+Math.sin(ol.angle*1.3)*1.2, Math.sin(ol.angle)*4);
            ol.light.intensity = 0.8+low*1.5+(isBeat?0.8:0);
            if (count>0) ol.light.color.setRGB(ol.color.r*(0.4+r*0.6), ol.color.g*(0.4+g*0.6), ol.color.b*(0.4+b*0.6));
        });

        // Wave floor
        const fp=this.floor.geometry.attributes.position.array;
        for (let i=0;i<fp.length/3;i++) {
            const x=fp[i*3], z=fp[i*3+2];
            fp[i*3+1]=Math.sin(x*0.6+Date.now()*0.0007)*0.04*(0.3+low)
                     +Math.sin(z*0.5+Date.now()*0.0009)*0.04*(0.3+avg)
                     +Math.sin((x+z)*0.4+Date.now()*0.0005)*0.03*(0.3+high);
        }
        this.floor.geometry.attributes.position.needsUpdate=true;
        this.floor.material.emissiveIntensity=0.15+low*0.3;
        this.floor.material.opacity=0.25+avg*0.25;

        // Bursts
        this.updateBursts(dt);
        // Branches
        this.branches.update(dt);

        // Bloom
        this.bloom.strength = 0.25+avg*0.4;

        if (isBeat) this.camera.position.y += 0.015;
        this.controls.update();
        this.composer.render();
    }

    onResize() {
        const w=innerWidth, h=innerHeight;
        this.camera.aspect=w/h; this.camera.updateProjectionMatrix();
        this.renderer.setSize(w,h); this.composer.setSize(w,h);
    }
}

// ─── KEYBOARD UI ────────────────────────────────────────────────
const NOTE_LABELS = {'C':'Do','D':'Re','E':'Mi','F':'Fa','G':'Sol','A':'La','B':'Si'};
function buildKeyboard(synth, visual) {
    const kb = document.getElementById('keyboard');
    const whiteN = ALL_NOTES.filter(n=>/^[A-G][0-9]$/.test(n));

    function createKey(note, isBlack) {
        const el=document.createElement('div');
        el.className=isBlack?'bk':'wk'; el.dataset.note=note;
        const glow=document.createElement('div'); glow.className='key-glow'; el.appendChild(glow);
        const base=note.replace(/[0-9]+/g,'');
        if (!isBlack) {
            const nl=document.createElement('div'); nl.className='note-label';
            nl.textContent=NOTE_LABELS[base]||''; el.appendChild(nl);
        }
        const kl=document.createElement('div'); kl.className='key-label';
        kl.textContent=BASE_TO_KEY[base]||''; el.appendChild(kl);
        if (isBlack) {
            const pos=NOTE_NAMES.indexOf(base);
            const wi={1:0,3:1,6:3,8:4,10:5}[pos];
            if (wi!==undefined) {
                const oct = parseInt(note.replace(/[A-Z#]+/g,''));
                const octOffset = (oct - 3) * 266; // 7 white keys * 38px per octave
                el.style.left=((wi+1)*38-11 + octOffset)+'px';
            }
        }
        return el;
    }

    whiteN.forEach(n=>kb.appendChild(createKey(n,false)));
    for (let o=3;o<=4;o++) BLACK_BASES.forEach(b=>kb.appendChild(createKey(b+o,true)));

    const allKeys=kb.querySelectorAll('.wk,.bk');
    let mouseDown=false;
    function press(el) {
        if (!el||el.classList.contains('pressed')) return;
        const n=el.dataset.note; el.classList.add('pressed');
        const c=NOTE_COLORS[n.replace(/[0-9]+/g,'')];
        const g=el.querySelector('.key-glow');
        if (g&&c) g.style.background=`radial-gradient(ellipse at center, rgba(${c.r*255|0},${c.g*255|0},${c.b*255|0},0.4) 0%, transparent 70%)`;
        synth.noteOn(n); visual.setNoteActive(n,true); visual.triggerNoteBurst(n,0.7);
        document.getElementById('active-count').textContent=visual.activeNotes.size;
    }
    function release(el) {
        if (!el) return;
        const n=el.dataset.note; el.classList.remove('pressed');
        synth.noteOff(n); visual.setNoteActive(n,false);
        document.getElementById('active-count').textContent=visual.activeNotes.size;
    }
    allKeys.forEach(el=>{
        el.addEventListener('mousedown',e=>{e.preventDefault();mouseDown=true;synth.resume();press(el);});
        el.addEventListener('mouseenter',()=>{if(mouseDown&&!el.classList.contains('pressed'))press(el);});
        el.addEventListener('mouseleave',()=>{if(el.classList.contains('pressed'))release(el);});
    });
    document.addEventListener('mouseup',()=>{mouseDown=false;});

    kb.addEventListener('touchstart',e=>{e.preventDefault();synth.resume();const t=e.changedTouches[0];const el=document.elementFromPoint(t.clientX,t.clientY);if(el&&(el.classList.contains('wk')||el.classList.contains('bk')))press(el);},{passive:false});
    kb.addEventListener('touchmove',e=>{e.preventDefault();const t=e.changedTouches[0];const el=document.elementFromPoint(t.clientX,t.clientY);allKeys.forEach(k=>{if(k.classList.contains('pressed')&&k!==el)release(k);});if(el&&(el.classList.contains('wk')||el.classList.contains('bk'))&&!el.classList.contains('pressed'))press(el);},{passive:false});
    kb.addEventListener('touchend',e=>{e.preventDefault();allKeys.forEach(k=>{if(k.classList.contains('pressed'))release(k);});},{passive:false});

    function shiftOctave(dir) {
        const n=CURRENT_OCTAVE+dir;
        if (n<1||n>7) return;
        CURRENT_OCTAVE=n; KEYBOARD_MAP=buildKeyMap(n);
        document.getElementById('oct-display').textContent=n;
    }

    document.addEventListener('keydown',e=>{
        if (e.repeat||e.target.tagName==='INPUT') return;
        if (e.key===',') { shiftOctave(-1); return; }
        if (e.key==='.') { shiftOctave(1); return; }
        const note=KEYBOARD_MAP[e.key.toLowerCase()];
        if (note) { e.preventDefault(); synth.resume(); const el=document.querySelector(`[data-note="${note}"]`); if (el&&!el.classList.contains('pressed')) press(el); }
    });
    document.addEventListener('keyup',e=>{
        if (e.key===','||e.key==='.') return;
        const note=KEYBOARD_MAP[e.key.toLowerCase()];
        if (note) { const el=document.querySelector(`[data-note="${note}"]`); if (el) release(el); }
    });
    document.getElementById('oct-down').addEventListener('click',()=>shiftOctave(-1));
    document.getElementById('oct-up').addEventListener('click',()=>shiftOctave(1));
}

// ─── INIT ───────────────────────────────────────────────────────
const synth=new SynthEngine();
const visual=new VisualScene(document.getElementById('three-container'));
buildKeyboard(synth, visual);

document.querySelectorAll('.preset-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
        document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active'); synth.setPreset(btn.dataset.preset); synth.allNotesOff();
    });
});
document.getElementById('volume-slider').addEventListener('input',e=>synth.setVolume(e.target.value/100));

let visMode='default';
document.getElementById('btn-vision').addEventListener('click',()=>{
    const modes=['default','wireframe','particles'];
    visMode=modes[(modes.indexOf(visMode)+1)%modes.length];
    document.getElementById('btn-vision').textContent='Visuales: '+visMode;
    if (visMode==='wireframe') { visual.nebula.material.size=0.05; visual.coreWire1.material.opacity=0.3; visual.coreWire2.material.opacity=0.2; visual.coreWire3.material.opacity=0.3; }
    else if (visMode==='particles') { visual.nebula.material.size=0.3; visual.coreWire1.material.opacity=0.05; visual.coreWire2.material.opacity=0.03; visual.coreParts.material.size=0.15; }
    else { visual.nebula.material.size=0.12; visual.coreWire1.material.opacity=0.12; visual.coreWire2.material.opacity=0.08; visual.coreWire3.material.opacity=0.15; visual.coreParts.material.size=0.06; }
});
document.getElementById('btn-fullscreen').addEventListener('click',()=>{
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
});

let lastTime=performance.now();
function animate(time) {
    const dt=Math.min((time-lastTime)/1000,0.05); lastTime=time;
    const data=synth.getAnalyserData();
    visual.update(data,dt);
    const avg=data.freq.reduce((a,b)=>a+b,0)/data.freq.length/255;
    const dot=document.getElementById('note-indicator');
    if (avg>0.1) dot.classList.add('active'); else dot.classList.remove('active');
    requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

function firstInteraction() { synth.init(); document.getElementById('loading').classList.add('hidden'); }
document.addEventListener('click',firstInteraction);
document.addEventListener('keydown',firstInteraction);
document.addEventListener('touchstart',firstInteraction);

console.log('✦ Nebulosa Sonora v3 — Energy Core + Piano real + Fadeout');
console.log('  Blancas: A S D F G H J  |  Negras: W E T Y U');
console.log('  , y . para cambiar octava');
